[package]
name = "bloco-de-notas"
version = "0.2.2"
edition = "2021"
description = "Um bloco de notas simples, rápido e escuro para Windows 10."
license = "MIT"
repository = "https://github.com/danilo-jesus-unifil/Bloco-de-notas"
readme = "README.md"
build = "build.rs"

[dependencies]
arboard = "3.4.1"
eframe = { version = "0.29.1", default-features = false, features = ["glow", "persistence", "x11", "wayland", "default_fonts"] }
rfd = "0.14.1"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
